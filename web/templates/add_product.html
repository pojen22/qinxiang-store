<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>新增商品</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-4" style="max-width:500px;">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">
                ➕ 新增商品
            </h2>

            <form method="post">

                <label class="form-label">
                    商品名稱
                </label>

                <input
                    class="form-control mb-3"
                    name="name"
                    placeholder="商品名稱"
                    required>

                <label class="form-label">
                    條碼
                </label>

                <input
                    class="form-control mb-3"
                    name="barcode"
                    placeholder="條碼">

                <label class="form-label">
                    售價
                </label>

                <input
                    class="form-control mb-3"
                    type="number"
                    name="price"
                    placeholder="售價"
                    min="0"
                    required>

                <label class="form-label">
                    冰箱容量
                </label>

                <input
                    class="form-control mb-3"
                    type="number"
                    name="fridge_max"
                    placeholder="冰箱容量"
                    min="0"
                    value="0"
                    required>

                <label class="form-label">
                    目前庫存
                </label>

                <input
                    class="form-control mb-3"
                    type="number"
                    name="fridge_now"
                    placeholder="目前庫存"
                    min="0"
                    value="0"
                    required>

                <label class="form-label">
                    巡冰箱順序
                </label>

                <input
                    class="form-control mb-3"
                    type="number"
                    name="display_order"
                    placeholder="0 = 一般商品"
                    min="0"
                    required>

                <div class="alert alert-info">
                    <strong>📌 商品分類</strong><br>
                    輸入 <strong>0</strong>：一般商品<br>
                    輸入 <strong>1、2、3...</strong>：冰箱商品
                </div>

                <label class="form-label">
                    補貨門檻
                </label>

                <input
                    class="form-control mb-3"
                    type="number"
                    name="restock_threshold"
                    placeholder="補貨門檻"
                    min="0"
                    value="0"
                    required>

                <button
                    class="btn btn-success btn-lg w-100">

                    💾 新增商品

                </button>

            </form>

            <br>

            <a
                href="/products"
                class="btn btn-secondary w-100">

                返回商品管理

            </a>

        </div>

    </div>

</div>

</body>

</html>
