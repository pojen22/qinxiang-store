<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>商品查價</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-4" style="max-width:420px;">

    <div class="card shadow">

        <div class="card-body">

            <h3 class="text-center mb-4">
                🔍 商品查價
            </h3>

            <form method="post">

                <input
                    class="form-control mb-3"
                    type="text"
                    name="keyword"
                    placeholder="商品名稱或條碼"
                    value="{{ keyword }}"
                    required>

                <button
                    class="btn btn-success w-100">
                    查詢
                </button>

            </form>

            {% if rows %}

            <hr>

            {% for row in rows %}

            <div class="card mb-3">

                <div class="card-body">

                    <h5 class="card-title">

                        {{ row[0] }}

                    </h5>

                    <p>

                        💰 售價：{{ row[1] }} 元

                    </p>

                    <p>

                        🧊 冰箱容量：{{ row[2] }} 瓶

                    </p>

                    <p>

                        📦 目前庫存：{{ row[3] }} 瓶

                    </p>

                    <p>

                        ⚠ 補貨門檻：{{ row[4] }} 瓶

                    </p>

                </div>

            </div>

            {% endfor %}

            {% endif %}

            <a href="/" class="btn btn-secondary w-100">
                回首頁
            </a>

        </div>

    </div>

</div>

</body>

</html>
