<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>巡冰箱</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-4" style="max-width:420px;">

<div class="card shadow">

<div class="card-body">

<h3 class="text-center mb-4">

🧊 巡冰箱

</h3>

<h4>{{ product[0] }}</h4>

<p>冰箱容量：{{ product[1] }} 瓶</p>

<p>目前庫存：{{ product[2] }} 瓶</p>

<p>補貨門檻：{{ product[3] }} 瓶</p>

<form method="post" action="/scan/{{ order }}">

<input
class="form-control mb-3"
type="number"
name="fridge_now"
value="{{ product[2] }}"
min="0"
max="{{ product[1] }}"
required>

<div class="text-center mb-3">

    <button
        type="button"
        class="btn btn-danger"
        onclick="minus()">

        −

    </button>

    <span
        id="value"
        class="mx-4 fs-2">

        {{ product[2] }}

    </span>

    <button
        type="button"
        class="btn btn-success"
        onclick="plus()">

        +

    </button>

</div>

<button
class="btn btn-success w-100">

儲存

</button>

</form>

<br>

<a
href="/"
class="btn btn-secondary w-100">

回首頁

</a>

</div>

</div>

</div>

<script>

const input = document.querySelector("input[name='fridge_now']");
const value = document.getElementById("value");

function plus(){

    let n = Number(input.value);

    n++;

    input.value = n;

    value.innerText = n;

}

function minus(){

    let n = Number(input.value);

    if(n>0){

        n--;

    }

    input.value = n;

    value.innerText = n;

}

</script>

</body>

</html>
