<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>巡冰箱</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-4" style="max-width:420px;">

    <div class="card shadow">

        <div class="card-body">

            <h3 class="text-center mb-4">
                🧊 巡冰箱
            </h3>

            <div class="text-center text-secondary mb-3">
                第 {{ order }} 項
            </div>

            <h3 class="text-center mb-4">
                {{ product[0] }}
            </h3>

            <p>🧊 冰箱容量：{{ product[1] }} 瓶</p>

            <p>⚠️ 補貨門檻：{{ product[3] }} 瓶</p>

            <form method="post" action="/scan/{{ order }}">

                <input
                    id="qty"
                    type="hidden"
                    name="fridge_now"
                    value="{{ product[2] }}">

                <div class="text-center my-4">

                    <div
                        id="value"
                        class="display-3 fw-bold">

                        {{ product[2] }}

                    </div>

                    <div class="text-muted">

                        目前庫存

                    </div>

                </div>

                <div class="d-grid gap-2">

                    <div class="row">

                        <div class="col-6">

                            <button
                                type="button"
                                class="btn btn-danger btn-lg w-100"
                                onclick="change(-5)">

                                -5

                            </button>

                        </div>

                        <div class="col-6">

                            <button
                                type="button"
                                class="btn btn-danger btn-lg w-100"
                                onclick="change(-1)">

                                -1

                            </button>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-6">

                            <button
                                type="button"
                                class="btn btn-success btn-lg w-100"
                                onclick="change(1)">

                                +1

                            </button>

                        </div>

                        <div class="col-6">

                            <button
                                type="button"
                                class="btn btn-success btn-lg w-100"
                                onclick="change(5)">

                                +5

                            </button>

                        </div>

                    </div>

                </div>

                <hr>

                <button
                    class="btn btn-primary btn-lg w-100">

                    💾 儲存並下一項

                </button>

            </form>

            <br>

            <a
                href="/"
                class="btn btn-secondary w-100">

                返回首頁

            </a>

        </div>

    </div>

</div>

<script>

const input = document.getElementById("qty");
const value = document.getElementById("value");

const MAX = {{ product[1] }};

function change(step){

    let n = Number(input.value);

    n += step;

    if(n < 0){
        n = 0;
    }

    if(n > MAX){
        n = MAX;
    }

    input.value = n;
    value.innerText = n;

}

</script>

</body>

</html>
