<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>巡冰箱</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div
    class="container py-3"
    style="max-width:500px;">

    <div class="card shadow">

        <div class="card-body">

            <!-- 標題 -->

            <h2 class="text-center fw-bold mb-2">

                🧊 巡冰箱

            </h2>


            <!-- 巡冰箱順序 -->

            <div class="text-center text-secondary mb-4">

                第 {{ order }} 項

            </div>


            <!-- 商品名稱 -->

            <div class="text-center mb-4">

                <h2 class="fw-bold">

                    {{ product[0] }}

                </h2>

            </div>


            <!-- 商品資訊 -->

            <div class="bg-light rounded p-3 mb-3">

                <div class="row text-center">

                    <div class="col-6">

                        <div class="text-secondary">

                            🧊 冰箱容量

                        </div>

                        <div class="fs-4 fw-bold">

                            {{ product[1] }}

                        </div>

                        <div class="text-secondary">

                            瓶

                        </div>

                    </div>


                    <div class="col-6">

                        <div class="text-secondary">

                            ⚠️ 補貨門檻

                        </div>

                        <div class="fs-4 fw-bold">

                            {{ product[3] }}

                        </div>

                        <div class="text-secondary">

                            瓶

                        </div>

                    </div>

                </div>

            </div>


            <!-- 目前庫存 -->

            <form
                method="post"
                action="/scan/{{ order }}">

                <input
                    id="qty"
                    type="hidden"
                    name="fridge_now"
                    value="{{ product[2] }}">


                <div class="text-center my-4">

                    <div
                        id="value"
                        class="display-1 fw-bold">

                        {{ product[2] }}

                    </div>

                    <div class="fs-5 text-secondary">

                        目前庫存

                    </div>

                </div>


                <!-- 庫存狀態 -->

                <div
                    id="status"
                    class="alert text-center fw-bold fs-5">

                </div>


                <!-- 數量按鈕 -->

                <div class="d-grid gap-3">

                    <div class="row g-2">

                        <div class="col-6">

                            <button
                                type="button"
                                class="btn btn-danger btn-lg w-100 py-3 fs-4"
                                onclick="change(-5)">

                                −5

                            </button>

                        </div>

                        <div class="col-6">

                            <button
                                type="button"
                                class="btn btn-danger btn-lg w-100 py-3 fs-4"
                                onclick="change(-1)">

                                −1

                            </button>

                        </div>

                    </div>


                    <div class="row g-2">

                        <div class="col-6">

                            <button
                                type="button"
                                class="btn btn-success btn-lg w-100 py-3 fs-4"
                                onclick="change(1)">

                                ＋1

                            </button>

                        </div>

                        <div class="col-6">

                            <button
                                type="button"
                                class="btn btn-success btn-lg w-100 py-3 fs-4"
                                onclick="change(5)">

                                ＋5

                            </button>

                        </div>

                    </div>

                </div>


                <hr class="my-4">


                <!-- 儲存 -->

                <button
                    type="submit"
                    class="btn btn-primary btn-lg w-100 py-3 fs-5">

                    💾 儲存並下一項

                </button>

            </form>


            <br>


            <!-- 回首頁 -->

            <a
                href="/"
                class="btn btn-secondary btn-lg w-100">

                🏠 返回首頁

            </a>

        </div>

    </div>

</div>


<script>

const input = document.getElementById("qty");

const value = document.getElementById("value");

const status = document.getElementById("status");

const MAX = {{ product[1] }};

const THRESHOLD = {{ product[3] }};


function updateStatus(){

    const n = Number(input.value);

    value.innerText = n;


    if(n <= THRESHOLD){

        status.className =
            "alert alert-danger text-center fw-bold fs-5";

        status.innerText =
            "⚠️ 需要補貨";

    }else{

        status.className =
            "alert alert-success text-center fw-bold fs-5";

        status.innerText =
            "✅ 庫存正常";

    }

}


function change(step){

    let n = Number(input.value);

    n += step;


    if(n < 0){

        n = 0;

    }


    if(n > MAX){

        n = MAX;

    }


    input.value = n;

    updateStatus();

}


updateStatus();

</script>


</body>

</html>
