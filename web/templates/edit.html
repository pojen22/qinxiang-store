<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>修改商品</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4" style="max-width:500px;">

<div class="card shadow">

<div class="card-body">

<h2 class="text-center mb-4">

✏️ 修改商品

</h2>

<form method="post">

<label class="form-label">商品名稱</label>

<input
class="form-control mb-3"
name="name"
value="{{ row[1] }}">

<label class="form-label">售價</label>

<input
class="form-control mb-3"
type="number"
name="price"
value="{{ row[2] }}">

<label class="form-label">冰箱容量</label>

<input
class="form-control mb-3"
type="number"
name="fridge_max"
value="{{ row[3] }}">

<label class="form-label">目前庫存</label>

<input
class="form-control mb-3"
type="number"
name="fridge_now"
value="{{ row[4] }}">

<label class="form-label">補貨門檻</label>

<input
class="form-control mb-3"
type="number"
name="restock_threshold"
value="{{ row[5] }}">

<button
class="btn btn-success w-100">

💾 儲存

</button>

</form>

<br>

<a
href="/products"
class="btn btn-secondary w-100">

返回商品管理

</a>

</div>

</div>

</div>

</body>

</html>
